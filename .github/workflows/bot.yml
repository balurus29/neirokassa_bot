name: Нейрокасса бот

on:
  workflow_dispatch:
    inputs:
      task:
        description: "morning | day | evening | inbox"
        required: true
        default: inbox

concurrency:
  group: neirokassa-${{ github.event.inputs.task == 'inbox' && 'inbox' || 'post' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Запуск
        env:
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: python -m bot.main "${{ github.event.inputs.task }}"

      - name: Сохранить state.json
        if: github.event.inputs.task != 'inbox'
        run: |
          git config user.name "neirokassa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state: ${{ github.event.inputs.task }}" && git push)
